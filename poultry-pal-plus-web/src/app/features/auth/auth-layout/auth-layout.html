<div class="page">
  <aside class="story" aria-hidden="true">
    <div class="brand">
      <img ngSrc="brand/logo.png" alt="" width="44" height="44" priority />
      <span>Poultry Pal <strong>Plus</strong></span>
    </div>
    <div class="pitch">
      <h2>Run your poultry farm with confidence.</h2>
      <ul>
        @for (item of highlights; track item.icon) {
          <li>
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.text }}</span>
          </li>
        }
      </ul>
    </div>
    <p class="footnote">Built for farms with patchy connectivity.</p>
  </aside>

  <main class="main">
    <section class="card" [class.wide]="wide()">
      <div class="mobile-brand">
        <img ngSrc="brand/logo.png" alt="" width="40" height="40" priority />
        <span>Poultry Pal <strong>Plus</strong></span>
      </div>
      <header>
        <h1>{{ heading() }}</h1>
        @if (subheading()) {
          <p class="sub">{{ subheading() }}</p>
        }
      </header>
      <ng-content />
    </section>
    <ng-content select="[authFooter]" />
  </main>
</div>
