<div class="pp-page">
  <app-page-header heading="Mortality" subtitle="Track losses and spot their causes early.">
    <button mat-flat-button type="button" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Record mortality
    </button>
  </app-page-header>

  @if (!loading()) {
    @if (hasRecords()) {
      <app-coop-filter [coops]="coops()" [(value)]="coopId" />
      <section class="kpis" aria-label="Summary">
        <app-kpi-card
          [compact]="true"
          label="Last 7 days"
          icon="date_range"
          tone="error"
          [value]="summary().week"
        />
        <app-kpi-card
          [compact]="true"
          label="This month"
          icon="calendar_month"
          tone="warning"
          [value]="summary().month"
        />
        <app-kpi-card
          [compact]="true"
          label="Most common cause"
          icon="medical_information"
          tone="info"
          [value]="summary().topReason"
        />
      </section>

      @if (rows().length === 0) {
        <p class="filtered-empty pp-surface-card">No losses recorded for this coop.</p>
      }
      <ul
        class="list pp-surface-card"
        aria-label="Mortality records"
        [hidden]="rows().length === 0"
      >
        @for (row of rows(); track row.record.id) {
          <li class="item" data-testid="mortality-row">
            <span class="icon" aria-hidden="true">
              <mat-icon>monitor_heart</mat-icon>
            </span>
            <div class="main">
              <span class="title">{{ row.title }}</span>
              <span class="meta">{{ row.meta }}</span>
            </div>
            <div class="side">
              <span class="chip">{{ row.record.reason }}</span>
              <app-sync-chip [status]="row.record.syncStatus" [compact]="true" />
            </div>
            <button
              mat-icon-button
              type="button"
              [matMenuTriggerFor]="menu"
              [attr.aria-label]="'More actions for ' + row.title"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xPosition="before">
              <button mat-menu-item type="button" (click)="openForm(row.record)">
                <mat-icon>edit</mat-icon>
                Edit
              </button>
              <button mat-menu-item type="button" (click)="remove(row.record)">
                <mat-icon>delete</mat-icon>
                Delete
              </button>
            </mat-menu>
          </li>
        }
      </ul>
    } @else {
      <div class="pp-surface-card">
        <app-empty-state
          icon="monitor_heart"
          heading="No losses recorded"
          [message]="
            coops().length > 0
              ? 'Record deaths and their cause to keep an eye on flock health.'
              : 'Mortality records belong to a coop. Your coops appear here after the first sync.'
          "
        />
      </div>
    }
  }
</div>
