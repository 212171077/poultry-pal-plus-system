<a class="brand" routerLink="/dashboard" (click)="navigated.emit()">
  <img ngSrc="brand/logo.png" alt="" width="40" height="40" priority />
  @if (!collapsed()) {
    <span class="brand-name">Poultry Pal <strong>Plus</strong></span>
  } @else {
    <span class="pp-sr-only">Poultry Pal Plus home</span>
  }
</a>

<nav aria-label="Main">
  <ul class="list">
    @for (item of primary(); track item.path) {
      <ng-container [ngTemplateOutlet]="link" [ngTemplateOutletContext]="{ $implicit: item }" />
    }
  </ul>
  <hr class="divider" />
  <ul class="list">
    @for (item of secondary(); track item.path) {
      <ng-container [ngTemplateOutlet]="link" [ngTemplateOutletContext]="{ $implicit: item }" />
    }
  </ul>
</nav>

<ng-template #link let-item>
  <li>
    <a
      class="link"
      [routerLink]="item.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [matTooltip]="collapsed() ? item.label : ''"
      matTooltipPosition="right"
      (click)="navigated.emit()"
    >
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span class="label">{{ collapsed() ? (item.shortLabel ?? item.label) : item.label }}</span>
    </a>
  </li>
</ng-template>
