<header class="bar">
  @if (showBrand()) {
    <a class="brand" routerLink="/dashboard">
      <img ngSrc="brand/logo.png" alt="" width="32" height="32" priority />
      <span>Poultry Pal <strong>Plus</strong></span>
    </a>
  }

  <span class="spacer"></span>

  @if (quickAdd()) {
    <button
      mat-flat-button
      type="button"
      class="quick-add"
      aria-haspopup="dialog"
      (click)="openQuickAdd()"
      matTooltip="Shortcut: N"
      aria-keyshortcuts="N"
    >
      <mat-icon>add</mat-icon>
      Quick add
    </button>
  }

  <app-sync-badge [compact]="compact()" />

  <button
    mat-icon-button
    type="button"
    [matMenuTriggerFor]="themeMenu"
    matTooltip="Appearance"
    aria-label="Change appearance"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu" xPosition="before">
    @for (option of themeOptions; track option.value) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="themePreference() === option.value"
        (click)="setTheme(option.value)"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label }}</span>
        @if (themePreference() === option.value) {
          <mat-icon class="check" aria-hidden="true">check</mat-icon>
        }
      </button>
    }
  </mat-menu>

  <button
    mat-icon-button
    type="button"
    class="avatar"
    [matMenuTriggerFor]="userMenu"
    matTooltip="Account"
    [attr.aria-label]="'Account menu for ' + displayName()"
  >
    @if (initials(); as initials) {
      <span class="initials" aria-hidden="true">{{ initials }}</span>
    } @else {
      <mat-icon>person</mat-icon>
    }
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before" class="pp-user-menu">
    <div class="account" (click)="$event.stopPropagation()" role="presentation">
      <span class="account-avatar" aria-hidden="true">{{ initials() }}</span>
      <div class="account-text">
        <strong>{{ displayName() }}</strong>
        @if (user()?.email; as email) {
          <span>{{ email }}</span>
        }
        <span class="role">
          {{ role() }}
          @if (farmName(); as farm) {
            · {{ farm }}
          }
        </span>
      </div>
    </div>
    <mat-divider />
    <a mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </a>
    <a mat-menu-item routerLink="/sync">
      <mat-icon>sync</mat-icon>
      <span>Sync center</span>
    </a>
    <mat-divider />
    <button mat-menu-item type="button" [disabled]="signingOut()" (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>{{ signingOut() ? 'Signing out…' : 'Sign out' }}</span>
    </button>
  </mat-menu>
</header>
