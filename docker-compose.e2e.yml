# Isolated stack for the live Playwright suite. Started and stopped by
# poultry-pal-plus-web/e2e-live (global setup/teardown) or ./run-e2e-tests.sh.
# No volumes: every run starts with an empty database. Never point this at dev/prod data.
name: ppp-e2e

services:
  mongo:
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${E2E_MONGO_PASSWORD:?set by the e2e runner}
      MONGO_INITDB_DATABASE: ${E2E_DB_NAME:?set by the e2e runner}
    ports:
      - 127.0.0.1:${E2E_MONGO_PORT:-27117}:27017
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 127.0.0.1:${E2E_MAILPIT_PORT:-8125}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./poultry-pal-service
      dockerfile: ../docker/e2e/backend.Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${E2E_DB_NAME}
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: ${E2E_MONGO_PASSWORD}
      POULTRY_PAL_APP_JWT_SECRET: ${E2E_JWT_SECRET:?set by the e2e runner}
      TLS_ENABLED: "false"
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:${E2E_WEB_PORT:-4310}
      # Mail settings seeded into app_config on first start; all mail goes to Mailpit.
      POULTRY_PAL_APP_MAIL_HOST: mailpit
      POULTRY_PAL_APP_MAIL_PORT: "1025"
      POULTRY_PAL_APP_MAIL_AUTH: "false"
      POULTRY_PAL_APP_MAIL_STARTTLS: "false"
      POULTRY_PAL_APP_MAIL_USER: e2e
      POULTRY_PAL_APP_MAIL_PASS: e2e
      POULTRY_PAL_APP_ADMIN_EMAIL: systemnotification.cs@gmail.com
    ports:
      - 127.0.0.1:${E2E_BACKEND_PORT:-8190}:8090

  web:
    build:
      context: ./poultry-pal-plus-web
    depends_on:
      - backend
    environment:
      TLS_ENABLED: "false"
      API_UPSTREAM: http://backend:8090
    ports:
      - 127.0.0.1:${E2E_WEB_PORT:-4310}:8080
