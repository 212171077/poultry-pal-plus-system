version: '3.7'
services:
  mongodb:
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Venus@18
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  poultry-pal-app:
    build:
      context: .
      args:
        DB_NAME: ${MONGO_DB_NAME:-poultry-pal-db}
    image: 212171077/poultry-pal:${IMAGE_TAG:-latest}
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: "${MONGO_DB_NAME:-poultry-pal-db}"
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: Venus@18
      POULTRY_PAL_APP_JWT_COOKIE_NAME: poultry-pal
      POULTRY_PAL_APP_JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET (base64, at least 64 bytes) in the environment or .env}"
      TLS_ENABLED: "${TLS_ENABLED:-true}"
      TLS_KEY_STORE_PASSWORD: "${TLS_KEY_STORE_PASSWORD:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://localhost:4200,https://tertiaryverify.dedicated.co.za:4200,http://localhost:4200}"
      COOKIE_SECURE: "${COOKIE_SECURE:-${TLS_ENABLED:-true}}"
      POULTRY_PAL_APP_JWT_EXPIRATION_MS: 86400000
      SPRING_MVC_PATHMATCH_MATCHING_STRATEGY: ANT_PATH_MATCHER
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
    ports:
      - 8090:8090

  # Offline-first web app (PWA). Serves the UI and proxies /api to the backend (same origin).
  poultry-pal-web:
    build: ../poultry-pal-plus-web
    depends_on:
      - poultry-pal-app
    environment:
      TLS_ENABLED: "${TLS_ENABLED:-true}"
      TLS_SERVER_NAME: tertiaryverify.dedicated.co.za
    volumes:
      - type: bind
        source: ../poultry-pal-plus-web/config
        target: /etc/nginx/tls
        read_only: true
    ports:
      - 8080:8080

volumes:
  mongo_data:
    driver: local
