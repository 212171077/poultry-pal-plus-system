version: '3.7'
services:
  mongodb:
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Venus@18
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  poultry-pal-app:
    image: 212171077/poultry-pal:latest
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: poultry-pal-db
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: Venus@18
      POULTRY_PAL_APP_JWT_COOKIE_NAME: poultry-pal
      POULTRY_PAL_APP_JWT_SECRET: ""
      POULTRY_PAL_APP_JWT_EXPIRATION_MS: 86400000
      SPRING_MVC_PATHMATCH_MATCHING_STRATEGY: ANT_PATH_MATCHER
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
    ports:
      - 8090:8090

volumes:
  mongo_data:
    driver: local
