# App Properties
poultry.pal.app.jwt.cookie.name=poultry-pal
poultry.pal.app.jwt.secret=${JWT_SECRET:}
poultry.pal.app.jwt.expiration.ms=86400000
poultry.pal.app.jwt.access-expiration.ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
poultry.pal.app.jwt.refresh-expiration.ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
poultry.pal.app.jwt.refresh-cookie.name=poultry-pal-refresh
poultry.pal.app.cookie.secure=${COOKIE_SECURE:${TLS_ENABLED:true}}
poultry.pal.app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
poultry.pal.app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:4200,https://tertiaryverify.dedicated.co.za:4200,http://localhost:4200}
logging.level.org.springframework=INFO
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.database=poultry-pal-db
spring.data.mongodb.host=localhost
spring.data.mongodb.password=Venus@18
spring.data.mongodb.port=27017
spring.data.mongodb.username=admin
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
server.port=8090
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# HTTPS Configuration (TLS_ENABLED=false restores HTTP on the same port)
server.ssl.enabled=${TLS_ENABLED:true}
server.ssl.key-store=${TLS_KEY_STORE:classpath:keystore/keystore.p12}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD:}
#server.ssl.key-store-password=Venus@18
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
