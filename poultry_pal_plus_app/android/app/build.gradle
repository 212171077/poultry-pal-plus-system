plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.poultry_pal_plus_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.poultry_pal_plus_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile file('keystore/poultrypalplus-key.jks')
            storePassword 'PoultryPalPlus'
            keyAlias 'poultrypalplus'
            keyPassword 'PoultryPalPlus'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    println "👉 Flutter Build Config:"
    println "   minSdkVersion = ${flutter.minSdkVersion}"
    println "   targetSdkVersion = ${flutter.targetSdkVersion}"
    println "   versionCode = ${flutter.versionCode}"
    println "   versionName = ${flutter.versionName}"
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.errorprone:error_prone_annotations:2.18.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}
